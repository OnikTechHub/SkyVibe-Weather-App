<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Web App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-area">
                <span class="weather-icon-lg">⛅</span>
                <h1>Weather Web App</h1>
            </div>
            <p class="subtitle">Get current and 24-hour weather for any location</p>
        </header>

        <!-- Search Controls -->
        <div class="search-section">
            <div class="input-wrapper">
                <span class="pin-icon">📍</span>
                <input type="text" id="cityInput" placeholder="Enter a location (e.g., Dhaka, Chittagong)">
            </div>
            <button id="locationBtn" class="secondary-btn">Use My Location</button>
            <button id="searchBtn" class="primary-btn" disabled>Get Weather</button>
        </div>
        <small class="helper-text" id="helperText">Disabled until a location is entered</small>

        <!-- Main Weather Dashboard Card -->
        <div class="weather-dashboard" id="weatherDashboard">
            <div class="current-main">
                <div class="condition-box">
                    <span id="mainWeatherIcon" class="big-emoji">⛅</span>
                    <h3 id="conditionText">Partly Cloudy</h3>
                </div>
                <div class="vertical-divider"></div>
                <div class="location-time-box">
                    <h2 id="locationName">Dhaka, Bangladesh</h2>
                    <p id="updateTime">Updated: --</p>
                    <div class="temp-large"><span id="tempValue">--</span>°C</div>
                </div>
                <div class="vertical-divider"></div>
                <div class="metrics-box">
                    <div class="metric-row">
                        <span>💨 Wind Speed: <strong id="windSpeed">-- km/h</strong></span>
                    </div>
                    <div class="metric-row">
                        <span>💧 Chance of Rain: <strong id="rainChance">-- %</strong></span>
                    </div>
                    <div class="metric-row">
                        <span>🌡️ Feels Like: <strong id="feelsLike">-- °C</strong></span>
                    </div>
                </div>
                <div class="vertical-divider"></div>
                <div class="refresh-box">
                    <button id="refreshBtn" class="refresh-action-btn">
                        <span class="spin-icon">🔄</span> Refresh
                    </button>
                    <small>Refresh the weather outlook</small>
                </div>
            </div>
        </div>

        <!-- Hourly Outlook Section (Previous & Next 24 Hours) -->
        <div class="outlook-wrapper">
            <!-- Previous 24 Hours -->
            <div class="outlook-card">
                <div class="outlook-title">
                    <span>🕒</span> <h3>Previous 24 Hours</h3>
                </div>
                <div class="hourly-scroll" id="prevHoursContainer"></div>
            </div>

            <!-- Next 24 Hours -->
            <div class="outlook-card">
                <div class="outlook-title">
                    <span>🕒</span> <h3>Next 24 Hours</h3>
                </div>
                <div class="hourly-scroll" id="nextHoursContainer"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
